<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethan Hernandez Mechanical Engineer</title>
<meta name="description" content="Mechanical engineering portfolio of Ethan Hernandez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">

<!--
  ===========================================================================
  ETHAN HERNANDEZ // PORTFOLIO
  ===========================================================================
  PHOTOS live in the "images" folder next to this file. Point at them like
  "images/apollo-1.jpg". Leave a photo field as "" and you get a dashed
  placeholder box instead.

  EDIT TWO PLACES:
    1. The ":root" block below  -> colors, fonts, spacing.
    2. The "SITE" object at the bottom -> banner photos and projects.

  Per project you can set fit: "contain" so the image is never cropped.
  Good for drawings and for photos shot on a plain background.
  ===========================================================================
-->

<style>
/* =========================================================================
   1. LOOK AND FEEL
   ========================================================================= */
:root{
  --bg:        #FFFFFF;
  --bg-2:      #F6F6F4;
  --ink:       #14161A;
  --ink-2:     #565D66;
  --ink-3:     #8A919A;
  --line:      #E3E4E1;
  --accent:    #2F5D62;     /* active tab, links */
  --accent-ink:#FFFFFF;
  --salmon:    #FA8072;     /* the About me / Projects page button */
  --salmon-ink:#2B1512;

  --font-head: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;

  --radius: 10px;
  --maxw:   1080px;
  --gap:    clamp(16px, 2.4vw, 26px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --bg-2:#1A1C1F; --ink:#ECEDEA; --ink-2:#A9B0B6; --ink-3:#787F86;
    --line:#2A2D31; --accent:#7FB7AE; --accent-ink:#14161A;
    --salmon:#FF8A76; --salmon-ink:#2B1512;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --bg-2:#1A1C1F; --ink:#ECEDEA; --ink-2:#A9B0B6; --ink-3:#787F86;
  --line:#2A2D31; --accent:#7FB7AE; --accent-ink:#14161A;
  --salmon:#FF8A76; --salmon-ink:#2B1512;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(18px,5vw,28px)}

/* =========================================================================
   2. BANNER: name over rotating photos
   ========================================================================= */
.hero{
  position:relative;width:100%;
  height:clamp(430px,74vh,780px);
  overflow:hidden;background:#0E1013;
  margin-bottom:clamp(40px,7vw,72px);
}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.hero .ph{background:#0E1013;border-color:#3C4249}
.hero__scrim{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,.34) 45%, rgba(0,0,0,.66));
}
.hero__text{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  padding:0 24px;color:#fff;
}
.hero__text h2{
  font-family:var(--font-body);font-weight:600;
  font-size:clamp(13px,1.6vw,17px);letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:14px;opacity:.92;
}
.hero__text h1{
  font-size:clamp(44px,8vw,94px);font-weight:700;letter-spacing:-.03em;
  text-shadow:0 2px 24px rgba(0,0,0,.35);
}
.hero__cap{
  position:absolute;left:0;right:0;bottom:0;padding:24px clamp(18px,5vw,28px) 16px;
  color:rgba(255,255,255,.9);font-size:13.5px;
}

/* =========================================================================
   3. PROJECTS
   ========================================================================= */
section{padding:0 0 clamp(40px,7vw,72px)}
.head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:clamp(24px,3.4vw,32px);font-weight:700}

.pagebtn{
  font-family:inherit;font-size:17px;font-weight:500;padding:13px 30px;border-radius:999px;
  cursor:pointer;background:var(--salmon);border:1px solid var(--salmon);color:var(--salmon-ink);
  transition:filter .15s ease, transform .15s ease;
}
.pagebtn:hover{filter:brightness(1.06);transform:translateY(-1px)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tab{
  font-family:inherit;font-size:14px;padding:8px 15px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink-2);transition:.15s ease;
}
.tab:hover{border-color:var(--ink-3);color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap)}
.proj{
  text-align:left;padding:0;cursor:pointer;font:inherit;color:inherit;
  background:transparent;border:0;display:flex;flex-direction:column;gap:12px;
}
.thumb{
  aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;
  background:var(--bg-2);border:1px solid var(--line);
  transition:transform .25s ease, box-shadow .25s ease;
}
.thumb img{width:100%;height:100%;object-fit:cover}
/* projects with fit:"contain" show the whole image instead of cropping it */
.thumb.contain img, .gallery > div.contain img{object-fit:contain}
.proj:hover .thumb{transform:translateY(-4px);box-shadow:0 12px 26px rgba(20,22,26,.12)}
.proj h3{font-size:19.5px;font-weight:600}
.proj .meta{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.proj .sum{font-size:15px;color:var(--ink-2);margin-top:8px}

/* dashed placeholder shown when a photo is missing */
.ph{
  width:100%;height:100%;display:grid;place-items:center;text-align:center;
  border:1px dashed var(--ink-3);border-radius:inherit;color:var(--ink-3);
  font-size:12.5px;letter-spacing:.04em;padding:14px;background:var(--bg-2);
}

/* =========================================================================
   4. ABOUT PAGE
   ========================================================================= */
.about{display:grid;grid-template-columns:270px 1fr;gap:clamp(22px,4vw,44px);align-items:start}
.about__photo{
  aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;
  background:var(--bg-2);border:1px solid var(--line);
}
.about__photo img{width:100%;height:100%;object-fit:cover}
.about__text p{font-size:16.5px;color:var(--ink-2);max-width:66ch}
.about__text p + p{margin-top:16px}
.contact{
  margin-top:clamp(26px,3vw,36px);
  border-left:3px solid var(--salmon);
  background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--salmon);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:20px 24px 22px;max-width:520px;
}
.contact__label{
  display:block;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px;
}
.contact ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.contact li{display:flex;align-items:baseline;gap:14px}
.contact__tag{
  flex:0 0 74px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}
.contact a{
  font-family:var(--font-head);font-size:clamp(16px,1.9vw,19px);font-weight:600;
  letter-spacing:-.01em;color:var(--ink);text-decoration:none;
  border-bottom:1px solid transparent;transition:.15s ease;overflow-wrap:anywhere;
}
.contact a:hover{color:var(--salmon);border-bottom-color:var(--salmon)}
@media (max-width:520px){
  .contact li{flex-direction:column;gap:2px}
  .contact__tag{flex:none}
}
.blocks h3{
  font-family:var(--font-body);font-size:12.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 16px;
}
.blocks{margin-top:clamp(32px,5vw,52px)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
.cols ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cols li{font-size:15px;color:var(--ink-2)}
.cols h4{font-family:var(--font-head);font-size:16px;font-weight:600;margin:0 0 8px}
.exp{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.exp__row{
  display:grid;grid-template-columns:160px 1fr;gap:18px;
  padding:16px 0;border-bottom:1px solid var(--line);
}
.exp__when{font-size:14px;color:var(--ink-3)}
.exp__what strong{font-family:var(--font-head);font-size:17px;font-weight:600;display:block}
.exp__what span{font-size:14px;color:var(--accent)}
.exp__what p{font-size:15px;color:var(--ink-2);margin-top:5px;max-width:70ch}
@media (max-width:760px){
  .about{grid-template-columns:1fr}
  .about__photo{max-width:220px}
  .exp__row{grid-template-columns:1fr;gap:4px}
}

/* =========================================================================
   5. PROJECT DETAIL
   ========================================================================= */
dialog.sheet{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);
  padding:0;width:min(840px,94vw);max-height:90vh;box-shadow:0 24px 60px rgba(0,0,0,.28);
}
dialog.sheet::backdrop{background:rgba(12,14,16,.6)}
.dlg__bar{
  position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:12px 18px;
}
.dlg__bar strong{font-family:var(--font-head);font-size:16px;font-weight:600}
.dlg__close{
  margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:999px;
  color:var(--ink-2);font:inherit;font-size:13px;padding:5px 13px;cursor:pointer;
}
.dlg__close:hover{border-color:var(--ink-3);color:var(--ink)}
.dlg__body{overflow-y:auto;max-height:calc(90vh - 54px);padding:22px 18px 30px}
.dlg__body h3{font-size:clamp(22px,3.2vw,30px);font-weight:700}
.dlg__meta{font-size:14px;color:var(--ink-3);margin:8px 0 20px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.gallery > div{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;background:var(--bg-2);border:1px solid var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.dlg__body h4{
  font-family:var(--font-body);font-size:12.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:24px 0 8px;
}
.dlg__body p.lede{font-size:16px;color:var(--ink-2);max-width:68ch}
.dlg__body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;max-width:68ch}
.dlg__body li{font-size:15.5px;color:var(--ink-2)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}

/* full size photo viewer, sits above the project popup */
dialog.lightbox{
  border:0;padding:0;background:transparent;overflow:hidden;
  width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;
}
dialog.lightbox[open]{display:grid;place-items:center}
dialog.lightbox::backdrop{background:rgba(8,9,11,.93)}
dialog.lightbox img{
  max-width:96vw;max-height:92dvh;width:auto;height:auto;object-fit:contain;
  border-radius:4px;cursor:zoom-out;background:#fff;
}

/* =========================================================================
   6. FOOTER
   ========================================================================= */
footer{border-top:1px solid var(--line);padding:clamp(28px,5vw,44px) 0}
footer a.mail{color:var(--accent);text-decoration:none;font-size:17px;font-weight:500}
footer a.mail:hover{text-decoration:underline}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<!-- BANNER -->

</main>

<footer>

<dialog class="sheet" id="dlg">

/* ==========================================================================
   Rendering. No need to edit past here.
   ========================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* an <img> that swaps to a dashed placeholder if the file is not there yet */
function pic(src, alt, note){
  const n = (note === undefined || note === null) ? "Photo goes here" : note;
  if(!src) return `<div class="ph">${esc(n)}</div>`;
  return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" data-ph="${esc(n)}" onerror="phFail(this)">`;
}
window.phFail = function(img){
  const d = document.createElement("div");
  d.className = "ph";
  const t = img.getAttribute("data-ph");
  d.textContent = (t === null) ? "Photo goes here" : t;
  img.replaceWith(d);
};
const dot = (a, b) => b ? esc(a) + " &middot; " + esc(b) : esc(a);

/* landing */
$("pName").textContent = SITE.name;
$("pTitle").textContent = SITE.title;
$("pMail").textContent = SITE.email;
$("pMail").href = "mailto:" + SITE.email;

/* banner: shuffle the photos, then cycle them */
const S = (SITE.banner || []).slice();
for(let i = S.length - 1; i > 0; i--){
  const j = Math.floor(Math.random() * (i + 1));
  [S[i], S[j]] = [S[j], S[i]];
}
let si = 0, timer = null;
$("slideFrame").innerHTML = S.map((s,i) =>
  `<div class="slide${i===0?" on":""}">${pic(s.image, s.caption, "")}</div>`
).join("");

function show(n){
  if(!S.length) return;
  si = (n + S.length) % S.length;
  [...$("slideFrame").children].forEach((el,i) => el.classList.toggle("on", i===si));
  $("slideCap").textContent = S[si].caption || "";
}
function play(){ stop(); timer = setInterval(() => show(si+1), 5500); }
function stop(){ if(timer) clearInterval(timer); timer = null; }
show(0);
if(S.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) play();

/* tabs */
let active = "All";
$("tabs").innerHTML = ["All", ...SITE.categories].map(c =>
  `<button class="tab" type="button" data-c="${esc(c)}" aria-pressed="${c==="All"}">${esc(c)}</button>`).join("");
$("tabs").onclick = (e) => {
  const b = e.target.closest(".tab"); if(!b) return;
  active = b.dataset.c;
  [...$("tabs").children].forEach(t => t.setAttribute("aria-pressed", t===b));
  draw();
};

/* project cards */
function draw(){
  const list = SITE.projects.filter(p => active === "All" || (p.cats || []).includes(active));
  $("grid").innerHTML = list.map(p => `
    <button class="proj" type="button" data-i="${SITE.projects.indexOf(p)}">
      <div class="thumb${p.fit === "contain" ? " contain" : ""}">${pic(p.cover, p.title, "Cover photo")}</div>
      <div>
        <h3>${esc(p.title)}</h3>
        <div class="meta">${dot(p.org, p.period)}</div>
        <p class="sum">${esc(p.summary)}</p>
      </div>
    </button>`).join("") || `<p style="color:var(--ink-3)">Nothing filed under ${esc(active)} yet.</p>`;
}
draw();

/* about page */
const A = SITE.about || {};
$("aboutPhoto").innerHTML = pic(A.photo, SITE.name, "Your photo");
$("aboutText").innerHTML = (A.paragraphs || []).map(t => `<p>${esc(t)}</p>`).join("");
const C = A.contact;
$("aboutContact").innerHTML = !C ? "" : `
  <span class="contact__label">${esc(C.label || "Reach me here")}</span>
  <ul>${(C.rows || []).map(r => `
    <li><span class="contact__tag">${esc(r.tag)}</span><a href="${esc(r.href)}"${
      r.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${esc(r.text)}</a></li>`).join("")}
  </ul>`;
$("aboutSkills").innerHTML = (A.skills || []).map(s =>
  `<div><h4>${esc(s.group)}</h4><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
$("aboutExp").innerHTML = (A.experience || []).map(e => `
  <div class="exp__row">
    <div class="exp__when">${esc(e.when)}</div>
    <div class="exp__what">
      <strong>${esc(e.role)}</strong>
      <span>${esc(e.org)}</span>
      <p>${esc(e.note)}</p>
    </div>
  </div>`).join("");

/* page switching between Projects and About me */
function openPage(name){
  const onAbout = name === "about";
  $("projects").hidden = onAbout;
  $("about").hidden = !onAbout;
  const top = document.querySelector("main").offsetTop - 20;
  if(window.scrollY > top) window.scrollTo({top: top});
}
document.querySelector("main").addEventListener("click", (e) => {
  const b = e.target.closest(".pagebtn"); if(!b) return;
  openPage(b.dataset.go);
  try { history.replaceState(null, "", b.dataset.go === "about" ? "#about" : "#"); } catch(_) {}
});
addEventListener("hashchange", () => openPage(location.hash === "#about" ? "about" : "projects"));
openPage(location.hash === "#about" ? "about" : "projects");

/* detail popup */
const dlg = $("dlg");
$("grid").onclick = (e) => {
  const b = e.target.closest(".proj"); if(!b) return;
  const p = SITE.projects[+b.dataset.i];
  const shots = [p.cover, ...(p.gallery || [])].filter(Boolean);
  const fit = p.fit === "contain" ? "contain" : "";
  $("dlgTag").textContent = p.org;
  $("dlgBody").innerHTML = `
    <h3>${esc(p.title)}</h3>
    <div class="dlg__meta">${dot(p.role, p.period)}</div>
    ${shots.length ? `<div class="gallery">${shots.map(src =>
      `<div class="${fit}">${pic(src, p.title, "Photo goes here")}</div>`).join("")}</div>` : ""}
    <p class="lede">${esc(p.overview)}</p>
    <h4>What I did</h4>
    <ul>${(p.points || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h4>Tools</h4>
    <div class="pills">${(p.tools || []).map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>`;
  dlg.showModal();
};
$("dlgClose").onclick = () => dlg.close();
dlg.addEventListener("click", (e) => { if(e.target === dlg) dlg.close(); });

/* click a gallery photo to see it full size */
const lb = $("lb");
$("dlgBody").addEventListener("click", (e) => {
  const img = e.target.closest(".gallery img"); if(!img) return;
  $("lbImg").src = img.getAttribute("src");
  $("lbImg").alt = img.getAttribute("alt") || "";
  lb.showModal();
});
lb.addEventListener("click", () => lb.close());
lb.addEventListener("close", () => { $("lbImg").src = ""; });
</script>
